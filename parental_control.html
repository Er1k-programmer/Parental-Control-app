<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#5367d8">
  <title>Parental Control</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(145deg, #eaf1ff, #f8f0ff);
      color: #202747;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    main {
      width: min(100%, 420px);
      text-align: center;
      background: rgba(255,255,255,.92);
      border-radius: 28px;
      padding: 32px 24px;
      box-shadow: 0 14px 40px rgba(53, 68, 130, .14);
    }
    .shield {
      width: 92px;
      height: 92px;
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
      border-radius: 28px;
      background: #e7ebff;
      font-size: 48px;
    }
    h1 { font-size: 28px; margin: 0 0 10px; }
    .intro { color: #66708c; line-height: 1.5; margin: 0 0 26px; }
    .link-button {
      display: flex;
      align-items: center;
      gap: 15px;
      width: 100%;
      min-height: 78px;
      padding: 16px;
      margin: 13px 0;
      text-decoration: none;
      color: #202747;
      text-align: left;
      border: 2px solid #edf0fa;
      border-radius: 18px;
      background: white;
      transition: transform .15s, box-shadow .15s, border-color .15s;
    }
    .link-button:hover, .link-button:focus-visible {
      transform: translateY(-2px);
      border-color: #aebaff;
      box-shadow: 0 7px 18px rgba(53, 68, 130, .10);
      outline: none;
    }
    .icon {
      flex: 0 0 46px;
      height: 46px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      font-size: 25px;
    }
    .parental { background: #e8edff; }
    .chat { background: #e3f7eb; }
    .label { font-weight: 700; font-size: 17px; display: block; }
    .sub { display: block; font-size: 13px; color: #77809a; margin-top: 5px; }
    .arrow { margin-left: auto; color: #858eaa; font-size: 23px; }
    footer { font-size: 12px; color: #8a91a7; margin-top: 24px; line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <div class="shield" aria-hidden="true">🛡️</div>
    <h1>Parental Control</h1>
    <p class="intro">Quick access to family safety tools and family communication.</p>

    <a class="link-button" href="https://familylink.google.com/controls" target="_blank" rel="noopener noreferrer">
      <span class="icon parental" aria-hidden="true">👨‍👩‍👧</span>
      <span>
        <span class="label">Parental Controls</span>
        <span class="sub">Manage your family's settings</span>
      </span>
      <span class="arrow" aria-hidden="true">›</span>
    </a>

    <a class="link-button" href="https://chat.google.com/" target="_blank" rel="noopener noreferrer">
      <span class="icon chat" aria-hidden="true">💬</span>
      <span>
        <span class="label">Family Chat</span>
        <span class="sub">Chat with your family</span>
      </span>
      <span class="arrow" aria-hidden="true">›</span>
    </a>

    <footer>Family safety starts with staying connected.</footer>
  </main>
</body>
</html>
